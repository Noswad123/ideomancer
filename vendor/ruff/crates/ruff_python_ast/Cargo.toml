[package]
name = "ruff_python_ast"
version = "0.0.0"
publish = false
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>"]
edition = "2024"
rust-version = "1.85"
homepage = "https://docs.astral.sh/ruff"
documentation = "https://docs.astral.sh/ruff"
repository = "https://github.com/astral-sh/ruff"
license = "MIT"
license-file = "../../LICENSE"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
test = false
doctest = false
bench = false

[dependencies]
ruff_python_trivia = { path = "../ruff_python_trivia" }
ruff_source_file = { path = "../ruff_source_file" }
ruff_text_size = { path = "../ruff_text_size" }
aho-corasick = "1.1.3"
bitflags = "2.5.0"
compact_str = "=0.9.0"
is-macro = "=0.3.7"
itertools = "=0.14.0"
memchr = "2.7.1"
rustc-hash = "=2.1.1"
thiserror = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(codspeed)', 'cfg(feature, values("cache", "salsa", "schemars", "serde"))'] }
