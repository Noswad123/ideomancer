name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      IDEOMANCER_TEST_NODE: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Provision the trusted syntax parser outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/ideomancer-tools" --ignore-scripts --no-audit --no-fund typescript@5.8.3
          printf 'IDEOMANCER_TEST_TYPESCRIPT=%s/ideomancer-tools/node_modules/typescript/lib/typescript.js\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check the reviewed source-package boundary
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check_package.py
      - run: cargo package --locked --allow-dirty
      - run: cargo build --release --locked
