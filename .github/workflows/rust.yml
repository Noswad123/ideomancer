name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ['1.89.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_AUTO_INSTALL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The Unicode-data derivation/oracle profile is explicitly pinned.
          python-version: '3.12.11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Record the selected toolchain
        run: |
          rustc --version --verbose
          cargo --version
          python --version
      - run: cargo fmt --package ideomancer --check
      - run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      - run: cargo test --locked
      - name: Compare private Python candidates with the trusted AST helper
        run: |
          export IDEOMANCER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --lib analysis::python_parity -- --ignored --test-threads=2
          cargo test --locked --lib analysis::python_native -- --ignored --test-threads=2
          cargo test --locked --lib analysis::python_ruff -- --ignored --test-threads=2
      - name: Check the reviewed Git-source boundary and Ruff provenance
        run: |
          python -B -m unittest discover -s scripts -p 'test_*.py'
          python -B scripts/check_checkout.py --source-dir .
          python -B scripts/check_ruff_vendor.py
          python -B scripts/check_python_unicode15.py
      - name: Verify an independent native JS/TS checkout consumer
        run: >-
          python -B scripts/check_checkout_consumer.py
          --source-dir .
          --no-offline
          --target-dir target
      - run: cargo build --release --locked
