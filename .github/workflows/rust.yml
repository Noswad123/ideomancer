name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ['1.89.0', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Record the selected toolchain
        run: |
          rustc --version --verbose
          cargo --version
          python --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check the reviewed source-package boundary
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check_package.py
      - run: cargo package --locked --allow-dirty
      - name: Verify the actual source archive and extracted bytes
        run: >-
          python scripts/check_package_archive.py
          --archive target/package/ideomancer-0.1.0.crate
          --source-dir .
          --extracted-dir target/package/ideomancer-0.1.0
      - name: Verify an independent native JS/TS package consumer
        run: >-
          python scripts/check_package_consumer.py
          --package-dir target/package/ideomancer-0.1.0
          --toolchain '${{ matrix.rust }}'
          --no-offline
          --target-dir target
      - run: cargo build --release --locked
